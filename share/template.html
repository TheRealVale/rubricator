<style>
/* ── themes ──────────────────────────────────────────────────────────────
   Three palettes, each with a rule rather than a mood. Rubric is the default:
   the tool is named after the scribe who added the red marks, so red is
   reserved for your annotations and status wears earth pigments instead.
   data-mode says light or dark for the handful of rules that must know. */
:root, html[data-theme="rubric"], html[data-theme="dark"]{
  --bg:#101013; --bg-elev:#17171b; --bg-soft:#131317;
  --fg:#e8e6e3; --fg-muted:#9b968e; --fg-dim:#6a655e;
  --border:#26262b; --border-soft:#1d1d21;
  --accent:#cf4b26; --accent-soft:rgba(207,75,38,.15);
  --green:#5f8f7a; --yellow:#b8863b; --red:#a8342a; --purple:#8a7f9e;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.30);
}
html[data-theme="slate"]{
  --bg:#0e1013; --bg-elev:#151a20; --bg-soft:#11151a;
  --fg:#e4e9ee; --fg-muted:#8794a1; --fg-dim:#5a6570;
  --border:#222a31; --border-soft:#1a2128;
  --accent:#8fa7bd; --accent-soft:rgba(143,167,189,.16);
  --green:#7f9e8c; --yellow:#a99268; --red:#b3868a; --purple:#9095a8;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.30);
}
html[data-theme="bone"], html[data-theme="light"]{
  --bg:#f4f1ea; --bg-elev:#e9e4d9; --bg-soft:#efece4;
  --fg:#22201c; --fg-muted:#6f6a60; --fg-dim:#9b958a;
  --border:#ddd7cb; --border-soft:#e7e2d7;
  --accent:#a8341c; --accent-soft:rgba(168,52,28,.10);
  --green:#3f6f56; --yellow:#9a6d21; --red:#a8341c; --purple:#6b5a8a;
  --shadow:0 1px 2px rgba(60,50,35,.07), 0 8px 24px rgba(60,50,35,.09);
}
:root{
  --radius:10px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --measure:png;
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;scroll-behavior:smooth;scroll-padding-top:80px}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--font); font-size:16.5px; line-height:1.72;
  font-variant-ligatures:common-ligatures; letter-spacing:.002em;
}
::selection{background:var(--accent-soft)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--fg-dim)}

/* ── top bar ─────────────────────────────────────────── */
.bar{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:12px;
  height:46px; padding:0 18px; background:color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--border-soft);
}
.bar .name{font-size:13px;font-weight:590;letter-spacing:-.01em;white-space:nowrap}
.bar .dir{font-size:12px;color:var(--fg-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.bar .meta{font-size:11.5px;color:var(--fg-dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.btn{
  all:unset; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  width:28px;height:28px;border-radius:7px;color:var(--fg-muted);
  transition:background .15s ease,color .15s ease;
}
.btn:hover{background:var(--bg-elev);color:var(--fg)}
.btn svg{width:15px;height:15px;display:block}
html[data-mode="dark"] .i-sun{display:block} html[data-mode="dark"] .i-moon{display:none}
html[data-mode="light"] .i-sun{display:none} html[data-mode="light"] .i-moon{display:block}

/* ── layout ──────────────────────────────────────────── */
.wrap{max-width:812px;margin:0 auto;padding:56px 28px 45vh}
#toc{
  position:fixed; top:96px; --toc-off:620px; left:max(20px, calc(50% - var(--toc-off))); width:212px;
  max-height:calc(100vh - 140px); overflow-y:auto; overscroll-behavior:contain;
  font-size:12.5px; line-height:1.5; z-index:30;
}
#toc::-webkit-scrollbar{width:0}
#toc .toc-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--fg-dim);margin-bottom:10px;font-weight:650}
#toc a{
  display:block; color:var(--fg-dim); text-decoration:none; padding:3.5px 10px;
  border-left:2px solid var(--border-soft); transition:color .15s,border-color .15s;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#toc a:hover{color:var(--fg)}
#toc a.lvl3{padding-left:22px;font-size:12px}
#toc a.active{color:var(--accent);border-left-color:var(--accent)}
@media (max-width:1180px){#toc{display:none}}

/* ── typography ──────────────────────────────────────── */
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{
  font-weight:640; line-height:1.25; letter-spacing:-.021em; text-wrap:balance;
  margin:2.1em 0 .7em; position:relative;
}
.md h1{font-size:2.05rem;margin-top:0;letter-spacing:-.028em}
.md h2{font-size:1.42rem;margin-top:2.4em;padding-bottom:.32em;border-bottom:1px solid var(--border-soft)}
.md h3{font-size:1.16rem}
.md h4{font-size:1rem}
.md h5,.md h6{font-size:.9rem;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.06em}
.md .anchor{
  position:absolute;left:-.85em;top:0;opacity:0;text-decoration:none;color:var(--fg-dim);
  font-weight:400;transition:opacity .15s;
}
.md h1:hover .anchor,.md h2:hover .anchor,.md h3:hover .anchor,.md h4:hover .anchor{opacity:1}
.md p{margin:0 0 1.15em;text-wrap:pretty}
.md a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .15s}
.md a:hover{border-bottom-color:var(--accent)}
.md strong{font-weight:640;color:var(--fg)}
.md em{font-style:italic}
.md del{color:var(--fg-dim)}
.md mark{background:var(--accent-soft);color:inherit;padding:.1em .25em;border-radius:3px}
.md ul,.md ol{margin:0 0 1.15em;padding-left:1.45em}
.md li{margin:.32em 0}
.md li::marker{color:var(--fg-dim)}
.md li>ul,.md li>ol{margin:.32em 0}
.md li>p{margin:.3em 0}
.md li.task{list-style:none;margin-left:-1.3em;display:flex;gap:.55em;align-items:flex-start}
.md li.task input{margin-top:.42em;accent-color:var(--accent);width:14px;height:14px}
.md li.task.done{color:var(--fg-muted);text-decoration:line-through;text-decoration-color:var(--border)}
.md hr{border:0;border-top:1px solid var(--border);margin:2.6em 0}
.md img{max-width:100%;border-radius:var(--radius);display:block;margin:1.4em 0}
.md kbd{
  font-family:var(--mono);font-size:.78em;padding:.18em .45em;border-radius:5px;
  background:var(--bg-elev);border:1px solid var(--border);border-bottom-width:2px;color:var(--fg-muted);
}
.md abbr{text-decoration:underline dotted;cursor:help}
.md sup a{font-size:.75em;padding:0 .15em}

/* ── quotes & alerts ─────────────────────────────────── */
.md blockquote{
  margin:1.5em 0; padding:.15em 0 .15em 1.15em; border-left:3px solid var(--border);
  color:var(--fg-muted);
}
.md blockquote p:last-child{margin-bottom:0}
.md .alert{
  border-left-width:3px; border-radius:0 8px 8px 0; padding:.9em 1.15em;
  background:var(--bg-soft); color:var(--fg);
}
.md .alert .alert-t{display:flex;align-items:center;gap:.45em;font-weight:640;font-size:.9em;margin-bottom:.35em}
.md .alert.note{border-left-color:var(--accent)} .md .alert.note .alert-t{color:var(--accent)}
.md .alert.tip{border-left-color:var(--green)} .md .alert.tip .alert-t{color:var(--green)}
.md .alert.important{border-left-color:var(--purple)} .md .alert.important .alert-t{color:var(--purple)}
.md .alert.warning{border-left-color:var(--yellow)} .md .alert.warning .alert-t{color:var(--yellow)}
.md .alert.caution{border-left-color:var(--red)} .md .alert.caution .alert-t{color:var(--red)}

/* ── code ────────────────────────────────────────────── */
.md code{
  font-family:var(--mono); font-size:.855em; background:var(--bg-elev);
  padding:.18em .38em; border-radius:5px; border:1px solid var(--border-soft);
  font-variant-ligatures:none;
}
.md pre{margin:0;background:none;border:0}
.md pre code{
  all:unset; display:block; font-family:var(--mono); font-size:13.2px; line-height:1.62;
  padding:14px 16px; overflow-x:auto; background:transparent; white-space:pre; font-variant-ligatures:none;
}
.code-block{
  position:relative; margin:1.5em 0; background:var(--bg-soft);
  border:1px solid var(--border-soft); border-radius:var(--radius); overflow:hidden;
}
.code-block .lang{
  position:absolute;top:8px;right:44px;font-family:var(--mono);font-size:10.5px;
  color:var(--fg-dim);text-transform:uppercase;letter-spacing:.06em;pointer-events:none;
  opacity:0;transition:opacity .15s;
}
.code-block .copy{
  position:absolute;top:6px;right:6px;opacity:0;transition:opacity .15s,background .15s;
  background:var(--bg-elev);border:1px solid var(--border);
}
.code-block:hover .copy,.code-block:hover .lang{opacity:1}
.code-block .copy.ok{color:var(--green)}
.md pre code::-webkit-scrollbar{height:8px}
.md pre code::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

/* ── tables ──────────────────────────────────────────── */
.table-wrap{overflow-x:auto;margin:1.5em 0;border:1px solid var(--border-soft);border-radius:var(--radius)}
.md table{border-collapse:collapse;width:100%;font-size:14.5px}
.md th,.md td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--border-soft)}
.md th{background:var(--bg-elev);font-weight:620;font-size:13px;letter-spacing:.005em;white-space:nowrap}
.md th[align=center],.md td[align=center]{text-align:center}
.md th[align=right],.md td[align=right]{text-align:right}
.md tbody tr:last-child td{border-bottom:0}
.md tbody tr:hover{background:var(--bg-elev)}

/* ── front matter ────────────────────────────────────── */
.fm{
  margin:0 0 2.4em; padding:14px 16px; background:var(--bg-soft);
  border:1px solid var(--border-soft); border-radius:var(--radius);
  font-size:13px; display:grid; grid-template-columns:auto 1fr; gap:5px 16px;
}
.fm dt{color:var(--fg-dim);font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.fm dd{margin:0;color:var(--fg-muted)}

/* ── mermaid ─────────────────────────────────────────── */
.mermaid{margin:1.6em 0;text-align:center;background:var(--bg-soft);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px;overflow-x:auto}
/* wide diagrams scroll rather than scale down into illegibility */
.mermaid svg{max-width:none;height:auto}
.mermaid::-webkit-scrollbar{height:8px}
.mermaid::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

/* ── print ───────────────────────────────────────────── */
@media print{
  .bar,#toc,.copy,.lang{display:none!important}
  html{--bg:#fff}
  body{background:#fff;color:#111;font-size:11pt}
  .wrap{max-width:none;padding:0}
  .md a{color:#111;border:0} .md h2{border-color:#ddd}
  .code-block,.table-wrap,.fm{border-color:#ddd;background:#fafafa;break-inside:avoid}
  .md h1,.md h2,.md h3{break-after:avoid}
}
</style>

/* ── P5 · the focus ring, put back ───────────────────────────────────────────
   `all:unset` appears 23 times across these stylesheets and it resets
   `outline-style`, so every control built that way lost the platform's focus
   ring by construction — on a tool whose interface is a keymap. `!important`
   is load-bearing rather than lazy: `.anno .x{all:unset}` is a two-class
   selector and outranks a bare `:focus-visible`, so without it the reset wins
   on exactly the elements that need the ring most. `:focus-visible`, not
   `:focus`, so a mouse click does not draw one. */
:focus-visible{outline:2px solid var(--accent) !important;outline-offset:2px}
</style>

<script>
(function(){
  "use strict";
  var META = __META__;
  var b64 = document.getElementById('payload').textContent.replace(/\s+/g,'');
  var bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  var raw = new TextDecoder('utf-8').decode(bytes);

  /* ── theme ── */
  var root = document.documentElement;
  MD.restoreTheme();
  function toggleTheme(){
    MD.setTheme(MD.nextTheme());
    if (window.mermaid) location.reload();   // the diagrams are drawn in the old colours
  }
  var themeBtn = document.getElementById('theme');
  themeBtn.addEventListener('click', toggleTheme);
  themeBtn.title = 'Theme (t)';
  document.addEventListener('keydown', function(e){
    if (e.metaKey||e.ctrlKey||e.altKey||/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key==='t') toggleTheme();
  });

  /* ── header ── */
  document.getElementById('fname').textContent = META.name;
  document.getElementById('fdir').textContent  = META.dir;
  document.getElementById('fmeta').textContent = META.words.toLocaleString() + ' words · ' + META.mtime;

  /* ── deep links: re-anchor after late layout shifts ── */
  function restoreHash(){
    if (!location.hash) return;
    var t = null;
    try { t = document.getElementById(decodeURIComponent(location.hash.slice(1))); } catch(e){}
    if (t) t.scrollIntoView({ block:'start', behavior:'instant' });
  }
  addEventListener('load', restoreHash);

  /* ── render ── */
  var doc = document.getElementById('doc');
  var out = MD.render({
    doc:  doc,
    fm:   document.getElementById('fm'),
    raw:  raw,
    base: META.base,
    onReady: function(){
      requestAnimationFrame(function(){ requestAnimationFrame(restoreHash); });
      setTimeout(restoreHash, 300);
    }
  });
  var body = out.body, fmLines = out.fmLines;

  restoreHash();

  /* ── TOC ── */
  var items = [].slice.call(doc.querySelectorAll('h2, h3'));
  if (items.length >= 3) {
    var nav = document.getElementById('toc'), list = document.getElementById('toc-list');
    items.forEach(function(h){
      var a = document.createElement('a');
      a.href = '#'+h.id; a.textContent = h.textContent.replace(/^#/,'').trim();
      a.className = h.tagName === 'H3' ? 'lvl3' : '';
      list.appendChild(a);
    });
    nav.hidden = false;
    var links = [].slice.call(list.children), map = {};
    links.forEach(function(a){ map[a.getAttribute('href').slice(1)] = a; });
    var active = null, ticking = false;
    function sync(){
      ticking = false;
      var cur = items[0], line = 96;
      for (var i=0;i<items.length;i++){
        if (items[i].getBoundingClientRect().top - line <= 0) cur = items[i]; else break;
      }
      if (window.scrollY + window.innerHeight >= document.body.scrollHeight - 4) cur = items[items.length-1];
      if (cur === active) return;
      if (active && map[active.id]) map[active.id].classList.remove('active');
      active = cur;
      if (map[cur.id]) {
        map[cur.id].classList.add('active');
        var r = map[cur.id].getBoundingClientRect(), nr = nav.getBoundingClientRect();
        if (r.top < nr.top || r.bottom > nr.bottom) map[cur.id].scrollIntoView({block:'nearest'});
      }
    }
    addEventListener('scroll', function(){ if (!ticking){ ticking = true; requestAnimationFrame(sync); } }, {passive:true});
    addEventListener('resize', sync, {passive:true});
