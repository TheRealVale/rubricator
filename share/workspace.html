<!doctype html>
<html lang="en" data-theme="rubric" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__NAME__ · rubricator</title>
<style>__BASECSS__</style>
<style>__SHELLCSS__</style>
<style>
/* ── things a surface puts on the page ───────────────────────────────────
   Everything below is content, not chrome: the shell owns the window, these
   rules own what a list, a table or a session detail looks like inside it. */
#projmenu{position:absolute;top:40px;left:14px;z-index:60;min-width:290px;border-radius:10px;
  background:var(--bg-elev);border:1px solid var(--border);box-shadow:var(--shadow);padding:5px}
#projmenu button{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:10px;
  padding:7px 10px;width:100%;box-sizing:border-box;border-radius:6px}
#projmenu button:hover{background:var(--bg-soft)}
#projmenu .nm{font-size:12.5px;color:var(--fg)}
#projmenu .pp{font-family:var(--mono);font-size:10.5px;color:var(--fg-dim);margin-left:auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
#projmenu .sep{height:1px;background:var(--border-soft);margin:5px 0}
#projmenu .none{font-size:11.5px;color:var(--fg-dim);padding:8px 10px;line-height:1.5}
.qbox{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--bg-elev);
  border:1px solid var(--border);border-radius:11px;margin-bottom:8px}
.qbox svg{width:16px;height:16px;color:var(--fg-dim);flex:none}
.qbox input{all:unset;flex:1;font-family:var(--font);font-size:15px;color:var(--fg)}
.qbox input::placeholder{color:var(--fg-dim)}
.qbox .hint{font-size:11px;color:var(--fg-dim);white-space:nowrap}
.qnote{font-size:11.5px;color:var(--fg-dim);margin:0 0 18px 4px}
.grp{margin:26px 0 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--fg-dim);font-weight:650;display:flex;align-items:center;gap:9px}
.grp .c{color:var(--fg-dim);opacity:.7;letter-spacing:0;text-transform:none;font-weight:500}
.row{padding:11px 13px;border:1px solid var(--border-soft);border-radius:10px;margin-bottom:7px;
  background:var(--bg-elev);cursor:pointer;transition:border-color .14s}
.row:hover{border-color:var(--border)}
.row .t{font-size:13.5px;font-weight:600;letter-spacing:-.005em;display:flex;gap:9px;align-items:baseline}
.row .t .p{font-family:var(--mono);font-size:11px;color:var(--fg-dim);font-weight:400}
.row .snip{font-size:12.5px;color:var(--fg-muted);margin-top:5px;line-height:1.55;white-space:pre-wrap}
.row .snip mark{background:var(--accent-soft);color:var(--fg);padding:0 2px;border-radius:3px}
.row .meta{font-size:11px;color:var(--fg-dim);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
.pill{font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid var(--border);color:var(--fg-dim)}
.pill.warn{color:var(--yellow);border-color:color-mix(in srgb,var(--yellow) 40%,transparent)}
.pill.hot{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.pill.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}
table.ws{width:100%;border-collapse:collapse;font-size:13px}
table.ws th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--fg-dim);padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap}
table.ws th:hover{color:var(--fg)}
table.ws td{padding:9px 10px;border-bottom:1px solid var(--border-soft);vertical-align:top}
table.ws tr:hover td{background:var(--bg-elev)}
table.ws .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.ws .f{font-family:var(--mono);font-size:11.5px}
.empty{padding:40px 10px;color:var(--fg-dim);font-size:13px;line-height:1.7}
.act{display:flex;gap:8px;margin:14px 0 0}
.act button{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:8px;
  background:var(--accent);color:#0b0d11}
.act button.ghost{background:none;border:1px solid var(--border);color:var(--fg-muted)}
.act button.ghost:hover{color:var(--fg);border-color:var(--fg-dim)}
html[data-mode="light"] .act button{color:#fff}
/* ── the navigator's own furniture ─────────────────────── */
.ctl{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 11px;font-size:12px;color:var(--fg-dim)}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--bg-elev);color:var(--fg)}
.chip{all:unset;cursor:pointer;font-size:11.5px;padding:5px 11px;border:1px solid var(--border);
  border-radius:20px;color:var(--fg-dim)}
.chip:hover{color:var(--fg)}
.chip.on{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.ctl .sp{margin-left:auto;font-size:11.5px;color:var(--fg-dim)}
.tree{font-size:13px}
.tdir{display:flex;align-items:center;gap:7px;padding:7px 6px;cursor:pointer;color:var(--fg-muted);
  font-weight:640;font-size:11.5px;letter-spacing:.01em}
.tdir:hover{color:var(--fg)}
.tdir .caret{font-size:9px;color:var(--fg-dim);transition:transform .14s;display:inline-block}
.tdir.closed .caret{transform:rotate(-90deg)}
.tdir .c{font-weight:400;color:var(--fg-dim);font-size:11px}
.tkids{margin-left:11px;border-left:1px solid var(--border-soft);padding-left:9px}
/* selection lives in a gutter column every row shares: the mark lines up down
   the whole list and the row itself is never decorated */
.tfile{display:flex;align-items:baseline;gap:10px;padding:6px 10px 6px 0;cursor:pointer;color:var(--fg-muted)}
.tfile::before{content:"";flex:none;width:3px;height:11px;margin:0 0 0 5.5px;align-self:center;background:transparent}
.tfile:hover{color:var(--fg)}
.tfile.on{color:var(--fg)}
.tfile.on::before{background:var(--accent)}
.tfile .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tfile .sub{font-size:11px;color:var(--fg-dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.tfile .n{font-size:10px;padding:1px 6px;border-radius:20px;background:var(--accent-soft);color:var(--fg)}
.tfile .w{color:var(--yellow)}
.tfile .kind{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;color:var(--fg-dim);
  border:1px solid var(--border);padding:0 4px;line-height:14px}
/* O2 · which repository a row is from, in a multi-root workspace, and whether
   its marks can be written. Only the first root has a notes store. */
.tfile .kind.repo{border-color:var(--border);color:var(--fg-muted)}
/* Q2 · what a document says about itself, in its own words */
.tfile .kind.st{border-color:var(--accent-soft);color:var(--fg-muted)}

/* ── Q1 · which conversations touched this document ────────────────────── */
.dsess{margin:14px 0 0;font-size:12px;line-height:1.6}
.dsess b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--fg-dim);font-weight:600;margin-bottom:6px}
.dsess.empty{color:var(--fg-dim);border-left:2px solid var(--border-soft);padding-left:11px}
.dsess.empty code{font-family:var(--mono);font-size:11px}
.dsess a.s{display:flex;gap:10px;align-items:baseline;cursor:pointer;
  padding:3px 0;color:var(--fg-muted);text-decoration:none}
.dsess a.s:hover{color:var(--fg)}
.dsess a.s .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsess a.s .w{font-size:10.5px;color:var(--fg-dim);font-family:var(--mono);flex:none}

/* ── Q3 · the dossier, read rather than only copied ────────────────────── */
pre.dossier{
  font-family:var(--mono);font-size:11.5px;line-height:1.62;color:var(--fg-muted);
  background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:10px;
  padding:16px 18px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:4px 0 0;
}
.saved{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 2px}
.saved .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--fg-dim)}
.nvctl .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--fg-dim);align-self:center;margin-right:2px}
.docnote{font-size:12px;color:var(--yellow);border:1px solid color-mix(in srgb,var(--yellow) 35%,transparent);
  padding:9px 13px;margin-bottom:22px}

/* ── sessions ────────────────────────────────────────────────────────────── */
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.dot.live{background:var(--green)}
.dot.arch{background:var(--fg-dim);opacity:.45}
.srow{display:flex;gap:11px;align-items:baseline;padding:8px 11px 8px 0;cursor:pointer;color:var(--fg-muted)}
.srow::before{content:"";flex:none;width:3px;height:11px;margin:0 0 0 5.5px;align-self:center;background:transparent}
.srow:hover{color:var(--fg)}
.srow.on{color:var(--fg)}
.srow.on::before{background:var(--accent)}
.srow .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.srow .sub{font-size:11px;color:var(--fg-dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.sdet h3{font-size:15.5px;margin:0 0 5px;letter-spacing:-.01em;line-height:1.45}
.sdet .who{font-size:11.5px;color:var(--fg-dim);margin-bottom:16px;display:flex;gap:11px;flex-wrap:wrap}
.plist{display:flex;flex-direction:column;gap:7px}
.pitem.hit{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.pitem mark{background:var(--accent-soft);color:var(--fg);padding:0 2px;border-radius:3px}
.pitem{font-size:12.5px;line-height:1.6;padding:9px 12px;border:1px solid var(--border-soft);
  border-radius:9px;background:var(--bg-elev);white-space:pre-wrap;overflow-wrap:anywhere}
.pitem .when{font-size:10.5px;color:var(--fg-dim);display:block;margin-bottom:4px}
.flist{font-family:var(--mono);font-size:11.5px;line-height:1.95}
.flist div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thc{border:1px solid var(--border);padding:12px 13px 13px;cursor:pointer;background:var(--bg-elev)}
.thc:hover{border-color:var(--fg-dim)}
.thc.on{border-color:var(--accent)}
.thc .sws{display:flex;height:26px;margin-bottom:11px}
.thc .sws i{flex:1;display:block}
.thc .thn{font-size:12.5px;font-weight:640;text-transform:capitalize;display:flex;align-items:baseline;gap:8px}
.thc .thn span{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--accent)}
.thc .thd{font-size:11px;line-height:1.55;color:var(--fg-dim);margin-top:5px}
.fld{all:unset;flex:1;min-width:220px;font-family:var(--mono);font-size:12px;color:var(--fg);
  padding:7px 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg-elev)}
.fld::placeholder{color:var(--fg-dim)}
.cmd{font-family:var(--mono);font-size:11.5px;padding:9px 12px;border:1px solid var(--border);
  border-radius:9px;background:var(--bg-soft);overflow-x:auto;white-space:nowrap;cursor:pointer}
.cmd:hover{border-color:var(--fg-dim)}
/* ── a conversation ──────────────────────────────────────────────────────
   Yours on the right, Claude's on the left — the one layout convention
   nobody has to be taught. What Claude *did* between saying things is a
   quiet line under the bubble, not another bubble. */
.convo{margin-top:4px}
.turn{display:flex;flex-direction:column;margin:0 0 16px}
.turn.cont{margin-top:-9px}
.turn.you{align-items:flex-end}
.turn.claude{align-items:flex-start}
.turn .bub{max-width:74%;min-width:0;padding:11px 15px;border-radius:12px;
  border:1px solid var(--border);background:var(--bg-elev);overflow-wrap:anywhere}
.turn.you .bub{background:var(--accent-soft);border-bottom-right-radius:3px;
  border-color:color-mix(in srgb,var(--accent) 34%,transparent)}
.turn.claude .bub{border-bottom-left-radius:3px}
.turn .tm{font-family:var(--mono);font-size:9.5px;color:var(--fg-dim);margin:0 4px 5px}
/* the reader's typography, at conversation scale */
.turn .md{font-size:13.5px;line-height:1.62}
.turn .md > :first-child{margin-top:0}
.turn .md > :last-child{margin-bottom:0}
.turn .md p{margin:0 0 .78em}
.turn .md ul,.turn .md ol{margin:0 0 .78em;padding-left:1.3em}
.turn .md h1,.turn .md h2,.turn .md h3,.turn .md h4{font-size:14px;margin:1.1em 0 .45em;
  padding:0;border:0;letter-spacing:-.005em}
.turn .md pre code{font-size:11.8px;line-height:1.55;padding:10px 12px}
.turn .md blockquote{margin:0 0 .78em}
.turn .md table{font-size:12px}
.turn .md .nothing{color:var(--fg-dim)}
.turn .md :not(pre) > code{overflow-wrap:anywhere}

/* one quiet row under the bubble, not a second bubble */
.did{margin-top:8px;padding-top:7px;border-top:1px solid var(--border-soft);min-width:0;
  font-size:10.5px;color:var(--fg-dim);display:flex;flex-wrap:wrap;align-items:baseline;
  gap:3px 14px}
.did .th{font-variant-numeric:tabular-nums}
.did details{flex:0 0 auto}
.did details[open]{flex:1 1 100%;min-width:0;overflow:hidden}
.did details summary{cursor:pointer;list-style:none;display:inline-flex;align-items:baseline;gap:5px}
.did details summary::-webkit-details-marker{display:none}
.did details summary::before{content:"\25B8";font-size:8.5px;display:inline-block;
  transition:transform .12s}
.did details[open] summary::before{transform:rotate(90deg)}
.did details summary:hover{color:var(--fg)}
.did .tool{display:flex;gap:9px;padding:3px 0 3px 14px;margin-top:2px;font-family:var(--mono);font-size:10.5px;
  min-width:0}
.did .tool .n{color:var(--fg-muted);flex:none}
.did .tool .b{color:var(--fg-dim);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;min-width:0;flex:1 1 auto}
.did .tool .err{color:var(--red);flex:none}
.did .wrote{display:flex;flex-wrap:wrap;gap:5px;flex:1 1 100%}
.fchip{font-family:var(--mono);font-size:10px;padding:2px 8px;border:1px solid var(--border);
  border-radius:20px;color:var(--fg-dim);display:inline-flex;gap:6px;align-items:baseline;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip i{font-style:normal;opacity:.66}
.fchip.go{cursor:pointer;color:var(--fg-muted)}
.fchip.go:hover{border-color:var(--accent);color:var(--fg)}
/* where the conversation was cut, compacted, or interrupted */
.cmark{display:flex;align-items:center;gap:11px;margin:20px 0;font-size:9.5px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--fg-dim)}
.cmark::before,.cmark::after{content:"";flex:1;height:1px;background:var(--border-soft)}
.cmark.interrupted{color:var(--yellow)}
.cmark.command span{font-family:var(--mono);text-transform:none;letter-spacing:0}

/* ── a document's history on one axis ───────────────────────────────────── */
.tl{position:relative;height:26px;margin:0 0 18px;font-size:10px;color:var(--fg-dim)}
.tl .axis{position:absolute;left:6%;right:6%;top:11px;height:1px;background:var(--border)}
.tl i{position:absolute;top:7px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;
  background:var(--fg-dim);opacity:.55}
.tl i.c{background:var(--fg-dim)}
.tl i.s{background:var(--accent);opacity:1;cursor:pointer;top:6px;width:9px;height:9px;margin-left:-4.5px}
.tl i.s:hover{transform:scale(1.35)}
.tl i.m{background:var(--green);opacity:1}
.tl .lo{position:absolute;left:0;top:0}
.tl .hi{position:absolute;right:0;top:0}

/* ── P5 · the focus ring, put back ───────────────────────────────────────────
   `all:unset` appears 23 times across these stylesheets and it resets
   `outline-style`, so every control built that way lost the platform's focus
   ring by construction — on a tool whose interface is a keymap. `!important`
   is load-bearing rather than lazy: `.anno .x{all:unset}` is a two-class
   selector and outranks a bare `:focus-visible`, so without it the reset wins
   on exactly the elements that need the ring most. `:focus-visible`, not
   `:focus`, so a mouse click does not draw one. */
:focus-visible{outline:2px solid var(--accent) !important;outline-offset:2px}

/* ── the navigator is narrow: one row of controls, the knobs behind a
      toggle, and a tree that gets the rest of the width ─────────────────── */
.nvctl{margin:0 0 6px}
.nvctl .r{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.nvctl .seg button{padding:4px 8px;font-size:11px}
.nvctl .sp{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--fg-dim)}
.nvctl .opt{all:unset;cursor:pointer;font-size:11px;color:var(--fg-dim);padding:4px 7px;border-radius:7px}
.nvctl .opt:hover{color:var(--fg)}
.nvctl .opt.on{color:var(--fg);background:var(--bg-elev)}
.nvb .chip{font-size:10.5px;padding:3px 8px}
.nvb .grp{margin:14px 0 5px;font-size:9.5px}
.nvb .empty{padding:22px 6px;font-size:12px}
.tdir .c{margin-left:auto}
.tfile.open::before{background:var(--border)}
.nvnote{font-size:11px;color:var(--fg-dim);line-height:1.6;padding:8px 4px 0}
.nvnote button{all:unset;cursor:pointer;color:var(--accent)}
.nvb .tfile{font-size:12.5px;padding:5px 8px 5px 0;gap:8px}
.nvb .srow{font-size:12.5px;padding:6px 8px 6px 0;gap:9px}

#reidx.busy svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:38px;left:50%;transform:translateX(-50%) translateY(6px);z-index:95;
  padding:9px 16px;border-radius:9px;background:var(--bg-elev);border:1px solid var(--border);
  box-shadow:var(--shadow);font-size:12.5px;opacity:0;pointer-events:none;transition:.18s}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
<style>__REVIEWCSS__
/* ── P5 · the keymap sheet ─────────────────────────────────────────────── */
#keys{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.42);backdrop-filter:blur(2px)}
#keys[hidden]{display:none}
html[data-mode="light"] #keys{background:rgba(60,50,35,.20)}
#keys .box{position:relative;width:min(680px,92vw);max-height:80vh;overflow-y:auto;
  background:var(--bg-elev);border:1px solid var(--border);border-radius:14px;padding:22px 26px 26px}
#keys h3{margin:0 0 16px;font-size:14px;font-weight:600;color:var(--fg)}
#keys .x{all:unset;cursor:pointer;position:absolute;top:12px;right:14px;
  color:var(--fg-dim);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
#keys .x:hover{color:var(--fg);background:var(--bg-soft)}
#keys .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px 30px}
#keys .grp b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--fg-dim);margin-bottom:8px}
#keys .row{display:flex;align-items:baseline;gap:10px;margin-bottom:5px;font-size:12.5px}
#keys kbd{font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);
  border:1px solid var(--border);border-radius:5px;padding:1px 6px;white-space:nowrap;flex:none;min-width:44px;text-align:center}
#keys .row span{color:var(--fg-muted)}
#keys .note{margin-top:18px;font-size:11.5px;color:var(--fg-dim);line-height:1.55;
  border-top:1px solid var(--border-soft);padding-top:13px}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <span class="who" id="wname" title="Switch project"></span>
    <span class="path" id="wpath"></span>
    <button class="find" id="findbtn" title="Find anything (⌘K)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <span class="t">Find anything</span><kbd>⌘K</kbd>
    </button>
    <span class="sp"></span>
    <button class="btn" id="navbtn" title="Navigator (⌘B)" aria-label="Toggle navigator">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
    </button>
    <button class="btn" id="morebtn" title="Surfaces" aria-label="Surfaces">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <button class="btn" id="theme" title="Theme (t)" aria-label="Theme">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <div class="mid">
    <nav id="nav">
      <div class="nvh" id="nvmodes"></div>
      <div class="nvq" id="nvq"></div>
      <div class="nvb" id="nvbody"></div>
      <div class="nvf" id="nvfoot"></div>
    </nav>
    <div class="rz" id="navrz" title="Drag to resize"></div>
    <div id="panes"></div>
    <div id="rail">
      <button class="rb" id="revbtn" title="Notes (f)" aria-label="Notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H8l-4 4z"/><path d="M8 9h8M8 12.5h5"/></svg>
        <span class="cnt" id="revcnt" style="display:none">0</span>
      </button>
      <span class="lbl">notes</span>
    </div>
  </div>
  <footer class="stat"><span class="l" id="stat-l"></span><span class="r" id="stat-r"></span></footer>
</div>

<!-- P5 · the keymap, in the tool whose interface is a keymap. Ported from the
     reader's ⌘/ sheet rather than invented a second time: same shape, same
     class names, the workspace's own keys. Reached from More and from ?. -->
<div id="keys" hidden>
  <div class="box">
    <button class="x" id="keys-x" aria-label="Close">&times;</button>
    <h3>Keys</h3>
    <div class="cols" id="keys-cols"></div>
  </div>
</div>
<div id="pal">
  <div class="box">
    <div class="qb">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="pal-i" placeholder="Documents, sessions, notes, surfaces…" autocomplete="off" spellcheck="false">
      <span class="cnt" id="pal-count"></span>
    </div>
    <div class="list" id="pal-list"></div>
    <div class="foot">
      <span>&crarr; open here</span><span>⌘&crarr; open in a split</span><span>⇥ filter by kind</span>
      <span class="kf" id="pal-kinds"></span>
    </div>
  </div>
</div>

<div class="pop" id="pop"></div>
<div class="composer" id="composer">
  <div class="chips" id="c-chips"></div>
  <textarea id="c-text" placeholder="What should change?" spellcheck="false"></textarea>
  <div class="foot"><span class="hint">&crarr; save &middot; esc close</span><button class="del" id="c-del">Delete</button></div>
</div>
<aside id="tray">
  <div class="th">
    <span class="t">Feedback</span>
    <span class="n" id="tray-count">0</span>
    <button class="btn" id="tray-close" title="Close (esc)" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="list" id="tray-list"></div>
  <div class="foot">
    <div class="tpl">
      <button data-tpl="apply">Apply</button>
      <button data-tpl="questions">Questions</button>
      <button data-tpl="raw">Raw</button>
    </div>
    <textarea class="pre" id="pre-box" spellcheck="false" placeholder="Instructions for the AI…"></textarea>
    <button class="go" id="go">Copy feedback</button>
    <div class="keys">
      <kbd>c</kbd> <kbd>?</kbd> <kbd>x</kbd> <kbd>e</kbd> <kbd>a</kbd> mark up &middot;
      <kbd>&#8984;</kbd><kbd>&crarr;</kbd> copy
    </div>
  </div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
